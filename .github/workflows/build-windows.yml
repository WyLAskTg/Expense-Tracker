name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compile Python files
        run: python -m py_compile app.py database.py i18n.py main.py record_utils.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Expense Tracker" main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Expense-Tracker-Windows
          path: dist/Expense Tracker.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: >
          gh release create "$env:TAG_NAME"
          "dist/Expense Tracker.exe"
          --title "Expense Tracker $env:TAG_NAME"
          --notes "Automated Windows build."
